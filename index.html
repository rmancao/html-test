<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RonMancao</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <button id="btn">Click Me</button>
    <button id="btn-greet">Greet Me!</button>
    <h1 id="message">Hello World!</h1>
    <button id="changeBtn">Change Message</button>
    
    <input type="text" id="name">
    <p id="output"></p>
    
    <form id="loginForm">
        <input type="text" id="username">
        <button type="submit">Login</button>
    </form>

    <button id="arrowFunction">Arrow</button>

    <button id="namedFunction">Named Event Handler Functions</button>

    <button id="box">BOX</button>

    <button id="increase">Increase</button>
    <h2 id="counter">0</h2>
    <button id="decrease">Decrease</button>

    <button id="pinky">PINK BACKGROUND</button>
    <button id="yellowy">YELLOW BACKGROUND</button>
    <button id="whitey">WHITE BACKGROUND</button>
</body>
</html>
